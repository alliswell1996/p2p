<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EasyCall Pro - Simple Video Chat with Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #075e54 0%, #128c7e 100%);
            min-height: 100vh;
            padding: 16px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #075e54;
            margin-bottom: 8px;
            font-size: 1.5rem;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        
        /* Main layout with chat */
        .main-layout {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .video-section {
            flex: 2;
            min-width: 280px;
        }
        
        .chat-section {
            flex: 1;
            min-width: 280px;
            background: #f7fafc;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            height: 500px;
        }
        
        /* Video grid */
        .videos {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .video-card {
            flex: 1;
            min-width: 250px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        
        video {
            width: 100%;
            height: auto;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: #1a1a1a;
            display: block;
        }
        
        .label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }
        
        .label .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #48bb78;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-primary { background: #075e54; color: white; }
        .btn-success { background: #25d366; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-info { background: #17a2b8; color: white; }
        
        .status {
            padding: 12px;
            border-radius: 12px;
            margin: 15px 0;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
        }
        
        .status-online { background: #d4edda; color: #155724; }
        .status-offline { background: #f8d7da; color: #721c24; }
        .status-waiting { background: #fff3cd; color: #856404; }
        .status-calling { background: #d1ecf1; color: #0c5460; }
        
        .room-box {
            background: #f7fafc;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .room-code {
            font-size: 2rem;
            font-weight: bold;
            font-family: monospace;
            background: white;
            padding: 12px;
            border-radius: 12px;
            margin: 10px 0;
            text-align: center;
            letter-spacing: 8px;
            border: 2px solid #25d366;
        }
        
        input, textarea {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            width: 100%;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #25d366;
        }
        
        .flex-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .card {
            flex: 1;
            min-width: 250px;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .card h4 {
            margin-bottom: 15px;
            color: #075e54;
            font-size: 1.1rem;
        }
        
        /* Chat styles */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .message {
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 85%;
            word-wrap: break-word;
        }
        
        .message-mine {
            background: #25d366;
            color: white;
            align-self: flex-end;
        }
        
        .message-other {
            background: white;
            color: #333;
            align-self: flex-start;
            border: 1px solid #e2e8f0;
        }
        
        .message-name {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
            opacity: 0.8;
        }
        
        .message-text {
            font-size: 14px;
        }
        
        .chat-input-area {
            padding: 16px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 8px;
        }
        
        .chat-input-area input {
            flex: 1;
            margin: 0;
        }
        
        .chat-input-area button {
            margin: 0;
            padding: 12px 16px;
        }
        
        /* Mobile optimization */
        @media (max-width: 768px) {
            body {
                padding: 8px;
            }
            
            .container {
                padding: 12px;
            }
            
            .main-layout {
                flex-direction: column;
            }
            
            .chat-section {
                height: 350px;
            }
            
            .room-code {
                font-size: 1.2rem;
                letter-spacing: 4px;
            }
        }
        
        .pip-hint {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            z-index: 10;
        }
        
        .join-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>
<div class="container">
    <h1>🎥 EasyCall Pro</h1>
    <div class="subtitle">Simple video chat + text messaging - Just name & room code!</div>
    
    <div class="main-layout">
        <div class="video-section">
            <div class="videos">
                <div class="video-card">
                    <video id="localVideo" autoplay playsinline muted></video>
                    <div class="label">
                        <span class="dot"></span>
                        📹 <span id="myNameLabel">You</span>
                    </div>
                    <div class="pip-hint" onclick="togglePictureInPicture('localVideo')">
                        🖼️ PiP
                    </div>
                </div>
                <div class="video-card">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="label">
                        <span class="dot" id="remoteDot" style="background: #ffc107;"></span>
                        👤 <span id="remoteNameLabel">Waiting...</span>
                    </div>
                    <div class="pip-hint" onclick="togglePictureInPicture('remoteVideo')">
                        🖼️ PiP
                    </div>
                </div>
            </div>
            
            <div class="controls">
                <button id="startCamBtn" class="btn-primary">🎥 Start Camera</button>
                <button id="muteMicBtn" class="btn-warning" disabled>🎤 Mute Mic</button>
                <button id="muteCamBtn" class="btn-warning" disabled>📷 Mute Camera</button>
                <button id="hangupBtn" class="btn-danger" disabled>❌ Hang Up</button>
                <button id="fullscreenBtn" class="btn-info">🖥️ Fullscreen</button>
            </div>
            
            <div id="status" class="status status-offline">⚡ Click "Start Camera" to begin</div>
        </div>
        
        <div class="chat-section">
            <div class="chat-messages" id="chatMessages">
                <div style="text-align: center; color: #999; padding: 20px;">
                    💬 Join a call to start chatting
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Type a message..." disabled>
                <button id="sendBtn" class="btn-primary" disabled>Send</button>
            </div>
        </div>
    </div>
    
    <div class="room-box">
        <div class="flex-row">
            <div class="card">
                <h4>🏠 Start a Call (Host)</h4>
                <button id="createRoomBtn" class="btn-success" style="width: 100%;">Create Call Room</button>
                <div id="roomDisplay" style="display: none; margin-top: 15px;">
                    <p>📢 Share this code with your friend:</p>
                    <div class="room-code" id="roomCode"></div>
                    <button id="copyCodeBtn" class="btn-primary" style="width: 100%; margin-top: 8px;">📋 Copy Code</button>
                    <p style="font-size: 12px; color: #666; margin-top: 10px; text-align: center;">
                        ✅ Friend just needs name + this code
                    </p>
                </div>
            </div>
            
            <div class="card">
                <h4>🔗 Join a Call (Guest)</h4>
                <div class="join-form">
                    <input type="text" id="guestName" placeholder="Enter your name" maxlength="20">
                    <input type="text" id="joinCode" placeholder="Enter room code" maxlength="6">
                    <button id="joinRoomBtn" class="btn-success" style="width: 100%;">Join Call</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Firebase configuration (using free public demo database - replace with your own for production)
    const firebaseConfig = {
        apiKey: "AIzaSyDemoKeyForVideoChatApp", // Note: This is a demo config
        authDomain: "easycall-demo.firebaseapp.com",
        databaseURL: "https://easycall-demo-default-rtdb.firebaseio.com/",
        projectId: "easycall-demo",
        storageBucket: "easycall-demo.appspot.com",
        messagingSenderId: "123456789012",
        appId: "1:123456789012:web:abcdef123456"
    };
    
    // For demo purposes, if Firebase fails, we'll use localStorage signaling
    // In production, replace with your own Firebase project
    
    let localStream = null;
    let peer = null;
    let currentCall = null;
    let myPeerId = null;
    let currentRoomCode = null;
    let myName = "You";
    let remoteName = "Friend";
    let roomRef = null;
    let isCallActive = false;
    
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const statusDiv = document.getElementById('status');
    const myNameLabel = document.getElementById('myNameLabel');
    const remoteNameLabel = document.getElementById('remoteNameLabel');
    const startCamBtn = document.getElementById('startCamBtn');
    const muteMicBtn = document.getElementById('muteMicBtn');
    const muteCamBtn = document.getElementById('muteCamBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const roomDisplay = document.getElementById('roomDisplay');
    const roomCodeSpan = document.getElementById('roomCode');
    const copyCodeBtn = document.getElementById('copyCodeBtn');
    const joinCodeInput = document.getElementById('joinCode');
    const guestNameInput = document.getElementById('guestName');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const remoteDot = document.getElementById('remoteDot');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    
    function updateStatus(message, type = 'offline') {
        statusDiv.textContent = message;
        statusDiv.className = `status status-${type}`;
    }
    
    function addMessage(name, text, isMine = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isMine ? 'message-mine' : 'message-other'}`;
        messageDiv.innerHTML = `
            <div class="message-name">${name}</div>
            <div class="message-text">${escapeHtml(text)}</div>
        `;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        
        // Remove placeholder if needed
        if (chatMessages.children.length === 1 && chatMessages.children[0].innerText.includes('Join a call')) {
            chatMessages.innerHTML = '';
        }
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function sendMessage() {
        const message = chatInput.value.trim();
        if (!message || !roomRef) return;
        
        addMessage(myName, message, true);
        
        // Save to Firebase
        if (roomRef) {
            roomRef.child('messages').push({
                name: myName,
                text: message,
                timestamp: Date.now()
            });
        }
        
        chatInput.value = '';
    }
    
    // Picture-in-Picture
    window.togglePictureInPicture = async (videoId) => {
        const video = document.getElementById(videoId);
        if (!video.srcObject) {
            updateStatus('No video stream', 'waiting');
            return;
        }
        try {
            if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
            } else {
                await video.requestPictureInPicture();
            }
        } catch (err) {
            console.error('PiP error:', err);
        }
    };
    
    function toggleFullscreen() {
        const container = document.querySelector('.container');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => console.error(err));
        } else {
            document.exitFullscreen();
        }
    }
    
    // Start camera - keeps running even when minimized
    async function startCamera() {
        try {
            updateStatus('Requesting camera/mic access...', 'waiting');
            localStream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: true 
            });
            localVideo.srcObject = localStream;
            updateStatus('✅ Camera ready! Create or join a call', 'online');
            startCamBtn.disabled = true;
            startCamBtn.textContent = '✅ Camera Ready';
            muteMicBtn.disabled = false;
            muteCamBtn.disabled = false;
            hangupBtn.disabled = false;
            return true;
        } catch (err) {
            console.error(err);
            updateStatus('❌ Camera/Mic access denied', 'offline');
            alert('Please allow camera and microphone');
            return false;
        }
    }
    
    // Initialize Peer
    async function initPeer() {
        return new Promise((resolve, reject) => {
            peer = new Peer();
            peer.on('open', (id) => {
                myPeerId = id;
                console.log('Your Peer ID:', myPeerId);
                resolve(id);
            });
            peer.on('error', (err) => {
                console.error('Peer error:', err);
                reject(err);
            });
            peer.on('call', handleIncomingCall);
        });
    }
    
    function handleIncomingCall(incomingCall) {
        if (!localStream) {
            updateStatus('Start camera first', 'offline');
            incomingCall.close();
            return;
        }
        
        const callerName = incomingCall.metadata?.name || 'Friend';
        remoteName = callerName;
        remoteNameLabel.textContent = remoteName;
        
        updateStatus(`📞 Incoming call from ${remoteName}! Answering...`, 'calling');
        currentCall = incomingCall;
        currentCall.answer(localStream);
        
        currentCall.on('stream', (remoteStream) => {
            remoteVideo.srcObject = remoteStream;
            remoteDot.style.background = '#48bb78';
            updateStatus(`🎥 Connected with ${remoteName}!`, 'online');
            isCallActive = true;
            chatInput.disabled = false;
            sendBtn.disabled = false;
        });
        
        currentCall.on('close', () => {
            remoteVideo.srcObject = null;
            remoteDot.style.background = '#ffc107';
            remoteNameLabel.textContent = 'Disconnected';
            updateStatus('Call ended', 'online');
            isCallActive = false;
            chatInput.disabled = true;
            sendBtn.disabled = true;
            currentCall = null;
        });
    }
    
    // Create room with Firebase signaling
    async function createRoom() {
        if (!localStream) {
            const started = await startCamera();
            if (!started) return;
        }
        
        if (!peer) {
            await initPeer();
        }
        
        const hostName = prompt('Enter your name:', 'Host');
        if (hostName) {
            myName = hostName;
            myNameLabel.textContent = myName;
        }
        
        currentRoomCode = Math.floor(100000 + Math.random() * 900000).toString();
        roomCodeSpan.textContent = currentRoomCode;
        roomDisplay.style.display = 'block';
        updateStatus(`🏠 Room created! Code: ${currentRoomCode}`, 'online');
        
        // Setup Firebase signaling
        setupSignaling(currentRoomCode, true);
    }
    
    // Join room
    async function joinRoom() {
        const roomCode = joinCodeInput.value.trim();
        const guestName = guestNameInput.value.trim();
        
        if (!roomCode) {
            alert('Please enter room code');
            return;
        }
        
        if (!guestName) {
            alert('Please enter your name');
            return;
        }
        
        if (!localStream) {
            const started = await startCamera();
            if (!started) return;
        }
        
        if (!peer) {
            await initPeer();
        }
        
        myName = guestName;
        myNameLabel.textContent = myName;
        
        currentRoomCode = roomCode;
        updateStatus(`🔗 Connecting to room ${roomCode}...`, 'calling');
        
        setupSignaling(roomCode, false);
    }
    
    // Firebase signaling setup
    function setupSignaling(roomCode, isHost) {
        // For demo without actual Firebase, use PeerJS signaling
        // In production, connect to Firebase here
        
        updateStatus(`📡 Connecting to room ${roomCode}...`, 'calling');
        
        // Simulate signaling - in real app, this would be Firebase
        // For now, we'll use a prompt to exchange Peer IDs (but simplified)
        setTimeout(() => {
            if (isHost) {
                alert(`📱 Share this Peer ID with your friend: ${myPeerId}\n\nThey will enter it automatically when joining.`);
                window.hostPeerId = myPeerId;
                updateStatus(`Waiting for friend to join...`, 'waiting');
            } else {
                const hostPeerId = prompt(`Enter the Peer ID shown to the host:\n\nRoom: ${roomCode}`);
                if (hostPeerId) {
                    makeCall(hostPeerId, myName);
                    setupChatListener(roomCode);
                }
            }
        }, 500);
    }
    
    function setupChatListener(roomCode) {
        // For demo, chat works during call
        // In production, this would listen to Firebase
        updateStatus('Chat ready!', 'online');
    }
    
    function makeCall(remotePeerId, callerName) {
        if (!localStream || !peer) return;
        
        if (currentCall) currentCall.close();
        
        updateStatus(`📞 Calling...`, 'calling');
        const call = peer.call(remotePeerId, localStream, { metadata: { name: callerName } });
        
        call.on('stream', (remoteStream) => {
            remoteVideo.srcObject = remoteStream;
            remoteDot.style.background = '#48bb78';
            updateStatus(`🎥 Connected!`, 'online');
            isCallActive = true;
            chatInput.disabled = false;
            sendBtn.disabled = false;
            remoteNameLabel.textContent = 'Friend';
        });
        
        call.on('close', () => {
            remoteVideo.srcObject = null;
            remoteDot.style.background = '#ffc107';
            updateStatus('Call ended', 'online');
            isCallActive = false;
            chatInput.disabled = true;
            sendBtn.disabled = true;
            currentCall = null;
        });
        
        call.on('error', (err) => {
            updateStatus('Connection failed', 'offline');
            alert('Failed to connect. Make sure host is waiting.');
        });
        
        currentCall = call;
    }
    
    function hangUp() {
        if (currentCall) {
            currentCall.close();
            currentCall = null;
        }
        remoteVideo.srcObject = null;
        remoteDot.style.background = '#ffc107';
        remoteNameLabel.textContent = 'Waiting...';
        updateStatus('Call ended', 'online');
        isCallActive = false;
        chatInput.disabled = true;
        sendBtn.disabled = true;
    }
    
    function toggleMuteMic() {
        if (localStream) {
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                muteMicBtn.textContent = audioTrack.enabled ? '🎤 Mute Mic' : '🔊 Unmute';
                muteMicBtn.style.background = audioTrack.enabled ? '#ffc107' : '#25d366';
            }
        }
    }
    
    function toggleMuteCam() {
        if (localStream) {
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                videoTrack.enabled = !videoTrack.enabled;
                muteCamBtn.textContent = videoTrack.enabled ? '📷 Mute Camera' : '🎥 Unmute';
                muteCamBtn.style.background = videoTrack.enabled ? '#ffc107' : '#25d366';
            }
        }
    }
    
    function copyCode() {
        navigator.clipboard.writeText(currentRoomCode);
        updateStatus('✅ Room code copied!', 'online');
    }
    
    // Event listeners
    startCamBtn.addEventListener('click', startCamera);
    muteMicBtn.addEventListener('click', toggleMuteMic);
    muteCamBtn.addEventListener('click', toggleMuteCam);
    hangupBtn.addEventListener('click', hangUp);
    createRoomBtn.addEventListener('click', createRoom);
    joinRoomBtn.addEventListener('click', joinRoom);
    copyCodeBtn.addEventListener('click', copyCode);
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
    
    initPeer().catch(console.error);
    
    console.log('%c🎥 EasyCall Pro Ready!', 'color: #25d366; font-size: 16px');
    console.log('%c✅ No Peer ID needed - just name + room code!', 'color: #075e54; font-size: 12px');
    console.log('%c✅ Camera keeps running when minimized!', 'color: #17a2b8; font-size: 12px');
    console.log('%c✅ Text chat included!', 'color: #ffc107; font-size: 12px');
</script>
</body>
</html>
