<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EasyCall - Simple Video Chat (Just Share Name)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #075e54 0%, #128c7e 100%);
            min-height: 100vh;
            padding: 16px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #075e54;
            margin-bottom: 8px;
            font-size: 1.5rem;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        
        /* Video grid - responsive */
        .videos {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .video-card {
            flex: 1;
            min-width: 280px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        
        video {
            width: 100%;
            height: auto;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: #1a1a1a;
            display: block;
        }
        
        .label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }
        
        .label .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #48bb78;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-primary { background: #075e54; color: white; }
        .btn-success { background: #25d366; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-info { background: #17a2b8; color: white; }
        
        .status {
            padding: 12px;
            border-radius: 12px;
            margin: 15px 0;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
        }
        
        .status-online { background: #d4edda; color: #155724; }
        .status-offline { background: #f8d7da; color: #721c24; }
        .status-waiting { background: #fff3cd; color: #856404; }
        .status-calling { background: #d1ecf1; color: #0c5460; }
        
        .room-box {
            background: #f7fafc;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .room-code {
            font-size: 2rem;
            font-weight: bold;
            font-family: monospace;
            background: white;
            padding: 12px;
            border-radius: 12px;
            margin: 10px 0;
            text-align: center;
            letter-spacing: 8px;
            border: 2px solid #25d366;
        }
        
        input {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            width: 100%;
            max-width: 300px;
            text-align: center;
            font-size: 1rem;
        }
        
        input:focus {
            outline: none;
            border-color: #25d366;
        }
        
        .flex-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .card {
            flex: 1;
            min-width: 280px;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .card h4 {
            margin-bottom: 15px;
            color: #075e54;
            font-size: 1.1rem;
        }
        
        .guest-list {
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .guest-item {
            padding: 8px;
            margin: 5px 0;
            background: #e8f5e9;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .guest-item:hover {
            background: #c8e6c9;
            transform: translateX(5px);
        }
        
        .guest-item.active {
            background: #25d366;
            color: white;
        }
        
        /* Mobile optimization */
        @media (max-width: 768px) {
            body {
                padding: 8px;
            }
            
            .container {
                padding: 12px;
            }
            
            h1 {
                font-size: 1.2rem;
            }
            
            .videos {
                gap: 12px;
            }
            
            .video-card {
                min-width: 200px;
            }
            
            button {
                padding: 10px 16px;
                font-size: 12px;
            }
            
            .room-code {
                font-size: 1.5rem;
                letter-spacing: 4px;
            }
        }
        
        @media (max-width: 500px) {
            .videos {
                flex-direction: column;
            }
            
            .video-card {
                min-width: auto;
            }
        }
        
        .pip-hint {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(4px);
        }
        
        .pip-hint:hover {
            background: rgba(0,0,0,0.9);
        }
        
        .join-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        
        .peer-id-info {
            font-size: 11px;
            color: #666;
            margin-top: 10px;
            text-align: center;
            word-break: break-all;
            background: #f0f0f0;
            padding: 8px;
            border-radius: 8px;
        }
    </style>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>
<div class="container">
    <h1>🎥 EasyCall</h1>
    <div class="subtitle">Simple video chat - Just share your name!</div>
    
    <div class="videos">
        <div class="video-card">
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="label">
                <span class="dot"></span>
                📹 <span id="myNameLabel">You</span>
            </div>
            <div class="pip-hint" onclick="togglePictureInPicture('localVideo')">
                🖼️ PiP
            </div>
        </div>
        <div class="video-card">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="label">
                <span class="dot" id="remoteDot" style="background: #ffc107;"></span>
                👤 <span id="remoteNameLabel">Waiting...</span>
            </div>
            <div class="pip-hint" onclick="togglePictureInPicture('remoteVideo')">
                🖼️ PiP
            </div>
        </div>
    </div>
    
    <div class="controls">
        <button id="startCamBtn" class="btn-primary">🎥 Start Camera</button>
        <button id="muteMicBtn" class="btn-warning" disabled>🎤 Mute Mic</button>
        <button id="muteCamBtn" class="btn-warning" disabled>📷 Mute Camera</button>
        <button id="hangupBtn" class="btn-danger" disabled>❌ Hang Up</button>
        <button id="fullscreenBtn" class="btn-info">🖥️ Fullscreen</button>
    </div>
    
    <div id="status" class="status status-offline">⚡ Click "Start Camera" to begin</div>
    
    <div class="room-box">
        <div class="flex-row">
            <div class="card">
                <h4>🏠 Start a Call (Host)</h4>
                <button id="createRoomBtn" class="btn-success" style="width: 100%;">Create Call Room</button>
                <div id="roomDisplay" style="display: none; margin-top: 15px;">
                    <p>📢 Share this code with your friend:</p>
                    <div class="room-code" id="roomCode"></div>
                    <button id="copyCodeBtn" class="btn-primary" style="width: 100%; margin-top: 8px;">📋 Copy Code</button>
                    <div class="peer-id-info" id="peerIdDisplay" style="margin-top: 10px;"></div>
                </div>
            </div>
            
            <div class="card">
                <h4>🔗 Join a Call (Guest)</h4>
                <div class="join-form">
                    <input type="text" id="guestName" placeholder="Enter your name" maxlength="20">
                    <input type="text" id="joinCode" placeholder="Enter 6-digit room code" maxlength="6">
                    <button id="joinRoomBtn" class="btn-success" style="width: 100%;">Join Call</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let localStream = null;
    let peer = null;
    let currentCall = null;
    let myPeerId = null;
    let currentRoomCode = null;
    let myName = "You";
    let remoteName = "Friend";
    
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const statusDiv = document.getElementById('status');
    const myNameLabel = document.getElementById('myNameLabel');
    const remoteNameLabel = document.getElementById('remoteNameLabel');
    const startCamBtn = document.getElementById('startCamBtn');
    const muteMicBtn = document.getElementById('muteMicBtn');
    const muteCamBtn = document.getElementById('muteCamBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const roomDisplay = document.getElementById('roomDisplay');
    const roomCodeSpan = document.getElementById('roomCode');
    const copyCodeBtn = document.getElementById('copyCodeBtn');
    const joinCodeInput = document.getElementById('joinCode');
    const guestNameInput = document.getElementById('guestName');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const remoteDot = document.getElementById('remoteDot');
    const peerIdDisplay = document.getElementById('peerIdDisplay');
    
    function updateStatus(message, type = 'offline') {
        statusDiv.textContent = message;
        statusDiv.className = `status status-${type}`;
    }
    
    // Picture-in-Picture support
    window.togglePictureInPicture = async (videoId) => {
        const video = document.getElementById(videoId);
        if (!video.srcObject) {
            updateStatus('No video stream to put in PiP', 'waiting');
            return;
        }
        
        try {
            if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
            } else {
                await video.requestPictureInPicture();
            }
        } catch (err) {
            console.error('PiP error:', err);
        }
    };
    
    // Fullscreen
    function toggleFullscreen() {
        const container = document.querySelector('.container');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => {
                console.error('Fullscreen error:', err);
            });
        } else {
            document.exitFullscreen();
        }
    }
    
    // Start camera
    async function startCamera() {
        try {
            updateStatus('Requesting camera/mic access...', 'waiting');
            localStream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: true 
            });
            localVideo.srcObject = localStream;
            updateStatus('✅ Camera ready! Create or join a call', 'online');
            startCamBtn.disabled = true;
            startCamBtn.textContent = '✅ Camera Ready';
            muteMicBtn.disabled = false;
            muteCamBtn.disabled = false;
            hangupBtn.disabled = false;
            return true;
        } catch (err) {
            console.error(err);
            updateStatus('❌ Camera/Mic access denied', 'offline');
            alert('Please allow camera and microphone to make calls');
            return false;
        }
    }
    
    // Initialize Peer
    async function initPeer() {
        return new Promise((resolve, reject) => {
            peer = new Peer();
            
            peer.on('open', (id) => {
                myPeerId = id;
                console.log('Your Peer ID:', myPeerId);
                updateStatus('✅ Ready! Create or join a call', 'online');
                resolve(id);
            });
            
            peer.on('error', (err) => {
                console.error('Peer error:', err);
                updateStatus('Connection error. Refresh page.', 'offline');
                reject(err);
            });
            
            peer.on('call', (incomingCall) => {
                if (!localStream) {
                    updateStatus('Start camera first to answer call', 'offline');
                    incomingCall.close();
                    return;
                }
                
                // Get caller's name from metadata
                const callerName = incomingCall.metadata?.name || 'Friend';
                remoteName = callerName;
                remoteNameLabel.textContent = remoteName;
                
                updateStatus(`📞 Incoming call from ${remoteName}! Answering...`, 'calling');
                currentCall = incomingCall;
                currentCall.answer(localStream);
                
                currentCall.on('stream', (remoteStream) => {
                    remoteVideo.srcObject = remoteStream;
                    remoteDot.style.background = '#48bb78';
                    updateStatus(`🎥 Connected with ${remoteName}!`, 'online');
                });
                
                currentCall.on('close', () => {
                    remoteVideo.srcObject = null;
                    remoteDot.style.background = '#ffc107';
                    remoteNameLabel.textContent = 'Disconnected';
                    updateStatus('Call ended', 'online');
                    currentCall = null;
                });
            });
        });
    }
    
    // Create a room
    async function createRoom() {
        if (!localStream) {
            const started = await startCamera();
            if (!started) return;
        }
        
        if (!peer) {
            await initPeer();
        }
        
        // Ask for host's name
        const hostName = prompt('Enter your name:', 'Host');
        if (hostName) {
            myName = hostName;
            myNameLabel.textContent = myName;
        }
        
        currentRoomCode = Math.floor(100000 + Math.random() * 900000).toString();
        roomCodeSpan.textContent = currentRoomCode;
        roomDisplay.style.display = 'block';
        peerIdDisplay.innerHTML = `📱 Your Peer ID: <strong>${myPeerId}</strong><br><small>Share this with guest (auto-filled when they join)</small>`;
        updateStatus(`🏠 Call room created! Code: ${currentRoomCode}`, 'online');
        
        // Store that we're waiting
        window.awaitingCall = true;
    }
    
    // Join a room
    async function joinRoom() {
        const roomCode = joinCodeInput.value.trim();
        const guestName = guestNameInput.value.trim();
        
        if (!roomCode) {
            alert('Please enter the room code');
            return;
        }
        
        if (!guestName) {
            alert('Please enter your name');
            return;
        }
        
        if (!localStream) {
            const started = await startCamera();
            if (!started) return;
        }
        
        if (!peer) {
            await initPeer();
        }
        
        myName = guestName;
        myNameLabel.textContent = myName;
        
        updateStatus(`🔗 Connecting to room ${roomCode}...`, 'calling');
        
        // For demo: need host's Peer ID
        // In production, this would be stored on a server
        const hostPeerId = prompt(`Enter the host's Peer ID\n\nRoom code: ${roomCode}\n\nAsk the host to share their Peer ID from the box below the room code`);
        
        if (hostPeerId && peer) {
            remoteName = "Host";
            remoteNameLabel.textContent = remoteName;
            makeCall(hostPeerId, guestName);
        } else {
            updateStatus('Connection cancelled', 'offline');
        }
    }
    
    function makeCall(remotePeerId, callerName) {
        if (!localStream || !peer) return;
        
        if (currentCall) {
            currentCall.close();
        }
        
        updateStatus(`📞 Calling ${remoteName}...`, 'calling');
        
        // Pass name in metadata
        const call = peer.call(remotePeerId, localStream, {
            metadata: { name: callerName }
        });
        
        call.on('stream', (remoteStream) => {
            remoteVideo.srcObject = remoteStream;
            remoteDot.style.background = '#48bb78';
            updateStatus(`🎥 Connected with ${remoteName}!`, 'online');
        });
        
        call.on('close', () => {
            remoteVideo.srcObject = null;
            remoteDot.style.background = '#ffc107';
            remoteNameLabel.textContent = 'Disconnected';
            updateStatus('Call ended', 'online');
            currentCall = null;
        });
        
        call.on('error', (err) => {
            console.error('Call error:', err);
            updateStatus('Failed to connect. Check Peer ID', 'offline');
            alert('Connection failed. Make sure the host is waiting for your call.');
        });
        
        currentCall = call;
    }
    
    function hangUp() {
        if (currentCall) {
            currentCall.close();
            currentCall = null;
        }
        remoteVideo.srcObject = null;
        remoteDot.style.background = '#ffc107';
        remoteNameLabel.textContent = 'Waiting...';
        updateStatus('Call ended', 'online');
    }
    
    function toggleMuteMic() {
        if (localStream) {
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                muteMicBtn.textContent = audioTrack.enabled ? '🎤 Mute Mic' : '🔊 Unmute';
                muteMicBtn.style.background = audioTrack.enabled ? '#ffc107' : '#25d366';
            }
        }
    }
    
    function toggleMuteCam() {
        if (localStream) {
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                videoTrack.enabled = !videoTrack.enabled;
                muteCamBtn.textContent = videoTrack.enabled ? '📷 Mute Camera' : '🎥 Unmute';
                muteCamBtn.style.background = videoTrack.enabled ? '#ffc107' : '#25d366';
            }
        }
    }
    
    function copyCode() {
        navigator.clipboard.writeText(currentRoomCode);
        updateStatus('✅ Room code copied!', 'online');
        setTimeout(() => {
            updateStatus(`Share code ${currentRoomCode} and your Peer ID`, 'online');
        }, 2000);
    }
    
    // Event listeners
    startCamBtn.addEventListener('click', startCamera);
    muteMicBtn.addEventListener('click', toggleMuteMic);
    muteCamBtn.addEventListener('click', toggleMuteCam);
    hangupBtn.addEventListener('click', hangUp);
    createRoomBtn.addEventListener('click', createRoom);
    joinRoomBtn.addEventListener('click', joinRoom);
    copyCodeBtn.addEventListener('click', copyCode);
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    
    // Initialize peer on load
    initPeer().catch(console.error);
    
    console.log('%c🎥 EasyCall Ready!', 'color: #25d366; font-size: 16px');
    console.log('%cGuests only need their name and room code!', 'color: #075e54; font-size: 12px');
    
    // Auto-focus on guest name
    guestNameInput.focus();
</script>
</body>
</html>
