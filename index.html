<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Video Call + Working Chat - Guaranteed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #075e54 0%, #128c7e 100%);
            min-height: 100vh;
            padding: 16px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #075e54;
            margin-bottom: 8px;
            font-size: 1.5rem;
        }
        
        .main-layout {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        
        .video-section {
            flex: 2;
            min-width: 280px;
        }
        
        .chat-section {
            flex: 1;
            min-width: 280px;
            background: #f7fafc;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            height: 550px;
            border: 1px solid #e2e8f0;
        }
        
        .videos {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .video-card {
            flex: 1;
            min-width: 250px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        
        video {
            width: 100%;
            height: auto;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: #1a1a1a;
            display: block;
        }
        
        .label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }
        
        .label .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #48bb78;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        
        .label .dot-off {
            background: #ffc107;
            animation: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        .chat-header {
            padding: 12px 16px;
            background: #075e54;
            color: white;
            border-radius: 16px 16px 0 0;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chat-status {
            font-size: 11px;
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 20px;
        }
        
        .chat-status.connected {
            background: #25d366;
            color: white;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #e8f0e8;
        }
        
        .message {
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 85%;
            word-wrap: break-word;
        }
        
        .message-mine {
            background: #dcf8c6;
            align-self: flex-end;
            color: #075e54;
        }
        
        .message-theirs {
            background: white;
            align-self: flex-start;
            border: 1px solid #ddd;
        }
        
        .message-system {
            background: #fff3cd;
            align-self: center;
            color: #856404;
            font-size: 11px;
            max-width: 90%;
            text-align: center;
        }
        
        .message-sender {
            font-size: 10px;
            font-weight: 600;
            margin-bottom: 3px;
            color: #666;
        }
        
        .message-text {
            font-size: 13px;
            word-break: break-word;
        }
        
        .message-time {
            font-size: 9px;
            color: #999;
            margin-top: 3px;
            text-align: right;
        }
        
        .chat-input-area {
            padding: 12px;
            border-top: 1px solid #ddd;
            background: white;
            border-radius: 0 0 16px 16px;
            display: flex;
            gap: 8px;
        }
        
        .chat-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }
        
        .chat-input:focus {
            border-color: #25d366;
        }
        
        .send-btn {
            padding: 8px 20px;
            background: #25d366;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
        }
        
        .send-btn:disabled, .chat-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-primary { background: #075e54; color: white; }
        .btn-success { background: #25d366; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-info { background: #17a2b8; color: white; }
        
        .status {
            padding: 12px;
            border-radius: 12px;
            margin: 15px 0;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
        }
        
        .status-online { background: #d4edda; color: #155724; }
        .status-offline { background: #f8d7da; color: #721c24; }
        .status-waiting { background: #fff3cd; color: #856404; }
        .status-calling { background: #d1ecf1; color: #0c5460; }
        
        .create-card, .join-card {
            background: #f7fafc;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }
        
        .invite-link {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 13px;
            border: 2px solid #25d366;
            cursor: pointer;
        }
        
        .name-input, .code-input {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            width: 100%;
            max-width: 280px;
            text-align: center;
            margin: 10px auto;
            display: block;
        }
        
        .pip-hint {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            z-index: 10;
        }
        
        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
            }
            .chat-section {
                height: 400px;
            }
        }
        
        .hidden {
            display: none;
        }
        
        .test-message {
            font-size: 11px;
            background: #e2e8f0;
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .flex-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }
    </style>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>
<div class="container">
    <h1>🎥 Video Call + Working Chat</h1>
    
    <div class="main-layout">
        <div class="video-section">
            <div class="videos">
                <div class="video-card">
                    <video id="localVideo" autoplay playsinline muted></video>
                    <div class="label">
                        <span class="dot" id="localDot"></span>
                        📹 <span id="myNameLabel">You</span>
                    </div>
                    <div class="pip-hint" onclick="togglePictureInPicture('localVideo')">🖼️ PiP</div>
                </div>
                <div class="video-card">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="label">
                        <span class="dot dot-off" id="remoteDot"></span>
                        👤 <span id="remoteNameLabel">Waiting...</span>
                    </div>
                    <div class="pip-hint" onclick="togglePictureInPicture('remoteVideo')">🖼️ PiP</div>
                </div>
            </div>
            
            <div class="controls">
                <button id="startCamBtn" class="btn-primary">🎥 Start Camera</button>
                <button id="muteMicBtn" class="btn-warning" disabled>🎤 Mute Mic</button>
                <button id="muteCamBtn" class="btn-warning" disabled>📷 Mute Camera</button>
                <button id="hangupBtn" class="btn-danger" disabled>❌ Hang Up</button>
            </div>
        </div>
        
        <div class="chat-section">
            <div class="chat-header">
                💬 Chat
                <span id="chatStatus" class="chat-status">🔴 Disconnected</span>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message message-system">💡 Start a call to enable chat</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" class="chat-input" placeholder="Type message..." disabled>
                <button id="sendBtn" class="send-btn" disabled>Send</button>
            </div>
        </div>
    </div>
    
    <div id="status" class="status status-offline">⚡ Click "Start Camera" to begin</div>
    
    <!-- Host Section -->
    <div id="hostSection" class="create-card">
        <h3>🏠 Start a Call (Host)</h3>
        <button id="createBtn" class="btn-success">🔗 Create Call Link</button>
        <div id="linkContainer" style="display: none; margin-top: 15px;">
            <p>Share this link with your friend:</p>
            <div class="invite-link" id="inviteLink"></div>
            <button id="copyBtn" class="btn-primary">📋 Copy Link</button>
        </div>
    </div>
    
    <!-- Guest Section -->
    <div id="guestSection" class="join-card hidden">
        <h3>🔗 Join a Call (Guest)</h3>
        <input type="text" id="guestName" class="name-input" placeholder="Your name">
        <button id="joinBtn" class="btn-success">🎥 Join Call</button>
    </div>
</div>

<script>
    // ========== DOM Elements ==========
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const statusDiv = document.getElementById('status');
    const myNameSpan = document.getElementById('myNameLabel');
    const remoteNameSpan = document.getElementById('remoteNameLabel');
    const startCamBtn = document.getElementById('startCamBtn');
    const muteMicBtn = document.getElementById('muteMicBtn');
    const muteCamBtn = document.getElementById('muteCamBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const createBtn = document.getElementById('createBtn');
    const joinBtn = document.getElementById('joinBtn');
    const hostSection = document.getElementById('hostSection');
    const guestSection = document.getElementById('guestSection');
    const guestNameInput = document.getElementById('guestName');
    const linkContainer = document.getElementById('linkContainer');
    const inviteLinkDiv = document.getElementById('inviteLink');
    const copyBtn = document.getElementById('copyBtn');
    const localDot = document.getElementById('localDot');
    const remoteDot = document.getElementById('remoteDot');
    
    // Chat elements
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatStatus = document.getElementById('chatStatus');
    
    // ========== Variables ==========
    let localStream = null;
    let peer = null;
    let currentCall = null;
    let myPeerId = null;
    let myName = "You";
    let remoteName = "Friend";
    let peerConnection = null;
    let dataChannel = null;
    let isInCall = false;
    
    // ========== Chat Functions ==========
    function addSystemMessage(text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message message-system';
        msgDiv.innerHTML = `<div class="message-text">${text}</div>`;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    function addChatMessage(text, isMine = false, senderName = '') {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isMine ? 'message-mine' : 'message-theirs'}`;
        
        if (!isMine && senderName) {
            const senderSpan = document.createElement('div');
            senderSpan.className = 'message-sender';
            senderSpan.textContent = senderName;
            msgDiv.appendChild(senderSpan);
        }
        
        const textSpan = document.createElement('div');
        textSpan.className = 'message-text';
        textSpan.textContent = text;
        
        const timeSpan = document.createElement('div');
        timeSpan.className = 'message-time';
        timeSpan.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        msgDiv.appendChild(textSpan);
        msgDiv.appendChild(timeSpan);
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    function updateChatUI(connected) {
        if (connected) {
            chatStatus.textContent = '🟢 Chat Ready';
            chatStatus.className = 'chat-status connected';
            chatInput.disabled = false;
            sendBtn.disabled = false;
            addSystemMessage('✅ Chat is now connected! You can send messages.');
        } else {
            chatStatus.textContent = '🔴 Disconnected';
            chatStatus.className = 'chat-status';
            chatInput.disabled = true;
            sendBtn.disabled = true;
        }
    }
    
    function sendMessage() {
        const message = chatInput.value.trim();
        if (!message) return;
        
        if (!dataChannel || dataChannel.readyState !== 'open') {
            addSystemMessage('⚠️ Chat not connected yet. Please wait a moment.');
            console.log('Data channel state:', dataChannel ? dataChannel.readyState : 'null');
            return;
        }
        
        try {
            const msgData = {
                type: 'chat',
                message: message,
                sender: myName,
                timestamp: Date.now()
            };
            dataChannel.send(JSON.stringify(msgData));
            addChatMessage(message, true);
            chatInput.value = '';
            console.log('✅ Message sent successfully');
        } catch (err) {
            console.error('Send error:', err);
            addSystemMessage('❌ Failed to send message');
        }
    }
    
    // ========== Data Channel Setup (SIMPLIFIED & GUARANTEED) ==========
    function setupDataChannel(conn) {
        console.log('Setting up data channel...');
        
        // Create data channel
        dataChannel = conn.createDataChannel('guaranteed-chat');
        
        dataChannel.onopen = () => {
            console.log('✅✅✅ DATA CHANNEL OPENED! ✅✅✅');
            updateChatUI(true);
        };
        
        dataChannel.onclose = () => {
            console.log('Data channel closed');
            updateChatUI(false);
        };
        
        dataChannel.onerror = (err) => {
            console.error('Data channel error:', err);
            addSystemMessage('⚠️ Chat error occurred');
        };
        
        dataChannel.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'chat') {
                    console.log('📩 Received message from', data.sender, ':', data.message);
                    addChatMessage(data.message, false, data.sender);
                }
            } catch (e) {
                console.error('Parse error:', e);
            }
        };
        
        return dataChannel;
    }
    
    function handleIncomingDataChannel(event) {
        console.log('📡 Incoming data channel received!');
        dataChannel = event.channel;
        
        dataChannel.onopen = () => {
            console.log('✅✅✅ INCOMING DATA CHANNEL OPENED! ✅✅✅');
            updateChatUI(true);
        };
        
        dataChannel.onclose = () => {
            console.log('Incoming data channel closed');
            updateChatUI(false);
        };
        
        dataChannel.onerror = (err) => {
            console.error('Incoming channel error:', err);
        };
        
        dataChannel.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'chat') {
                    console.log('📩 Received message from', data.sender);
                    addChatMessage(data.message, false, data.sender);
                }
            } catch (e) {
                console.error('Parse error:', e);
            }
        };
    }
    
    // ========== Video Call Functions ==========
    function updateStatus(message, type) {
        statusDiv.textContent = message;
        statusDiv.className = `status status-${type}`;
    }
    
    window.togglePictureInPicture = async (videoId) => {
        const video = document.getElementById(videoId);
        if (!video.srcObject) return;
        try {
            if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
            } else {
                await video.requestPictureInPicture();
            }
        } catch (err) {}
    };
    
    async function startCamera() {
        try {
            updateStatus('Requesting camera...', 'waiting');
            const constraints = {
                video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
                audio: { echoCancellation: true, noiseSuppression: true }
            };
            localStream = await navigator.mediaDevices.getUserMedia(constraints);
            localVideo.srcObject = localStream;
            localDot.style.background = '#48bb78';
            updateStatus('✅ Camera ready! Create a link', 'online');
            startCamBtn.disabled = true;
            startCamBtn.textContent = '✅ Camera Ready';
            muteMicBtn.disabled = false;
            muteCamBtn.disabled = false;
            hangupBtn.disabled = false;
            return true;
        } catch (err) {
            updateStatus('❌ Camera access denied', 'offline');
            alert('Please allow camera access');
            return false;
        }
    }
    
    function toggleMuteMic() {
        if (localStream) {
            const track = localStream.getAudioTracks()[0];
            if (track) {
                track.enabled = !track.enabled;
                muteMicBtn.textContent = track.enabled ? '🎤 Mute Mic' : '🔊 Unmute';
                muteMicBtn.style.background = track.enabled ? '#ffc107' : '#25d366';
            }
        }
    }
    
    function toggleMuteCam() {
        if (localStream) {
            const track = localStream.getVideoTracks()[0];
            if (track) {
                track.enabled = !track.enabled;
                muteCamBtn.textContent = track.enabled ? '📷 Mute Camera' : '🎥 Unmute';
                muteCamBtn.style.background = track.enabled ? '#ffc107' : '#25d366';
                localDot.style.background = track.enabled ? '#48bb78' : '#ffc107';
            }
        }
    }
    
    // ========== Peer Initialization ==========
    async function initPeer() {
        return new Promise((resolve, reject) => {
            peer = new Peer();
            peer.on('open', (id) => {
                myPeerId = id;
                console.log('My Peer ID:', id);
                resolve(id);
            });
            peer.on('error', (err) => {
                console.error('Peer error:', err);
                reject(err);
            });
            peer.on('call', (call) => {
                if (!localStream) {
                    call.close();
                    return;
                }
                
                const callerName = call.metadata?.name || 'Friend';
                remoteName = callerName;
                remoteNameSpan.textContent = remoteName;
                updateStatus(`📞 Incoming call from ${remoteName}!`, 'calling');
                
                call.ondatachannel = handleIncomingDataChannel;
                currentCall = call;
                currentCall.answer(localStream);
                
                currentCall.on('stream', (stream) => {
                    remoteVideo.srcObject = stream;
                    remoteDot.style.background = '#48bb78';
                    remoteDot.classList.remove('dot-off');
                    isInCall = true;
                    updateStatus(`🎥 Connected with ${remoteName}!`, 'online');
                    addSystemMessage(`🎥 Connected with ${remoteName}`);
                });
                
                currentCall.on('close', () => {
                    remoteVideo.srcObject = null;
                    remoteDot.style.background = '#ffc107';
                    remoteDot.classList.add('dot-off');
                    remoteNameSpan.textContent = 'Disconnected';
                    isInCall = false;
                    updateChatUI(false);
                    dataChannel = null;
                    updateStatus('Call ended', 'online');
                    addSystemMessage('📞 Call ended');
                });
            });
        });
    }
    
    // ========== Host Creates Link ==========
    async function createCall() {
        if (!localStream) {
            const started = await startCamera();
            if (!started) return;
        }
        if (!peer) {
            await initPeer();
        }
        
        const name = prompt('Enter your name:', 'Host');
        if (name) {
            myName = name;
            myNameSpan.textContent = myName;
        }
        
        const roomId = Math.random().toString(36).substring(2, 10);
        const link = `${window.location.origin}${window.location.pathname}?join=${myPeerId}&room=${roomId}`;
        inviteLinkDiv.textContent = link;
        linkContainer.style.display = 'block';
        updateStatus('🔗 Link created! Share it with your friend', 'online');
        addSystemMessage('📢 Invite link created! Share it to start call');
    }
    
    function copyLink() {
        navigator.clipboard.writeText(inviteLinkDiv.textContent);
        updateStatus('✅ Link copied!', 'online');
        addSystemMessage('📋 Link copied to clipboard');
    }
    
    // ========== Guest Joins ==========
    async function autoJoin() {
        const params = new URLSearchParams(window.location.search);
        const hostId = params.get('join');
        
        if (hostId) {
            hostSection.classList.add('hidden');
            guestSection.classList.remove('hidden');
            await startCamera();
            await initPeer();
            window.hostId = hostId;
            updateStatus('🔗 Enter your name and click Join', 'waiting');
        }
    }
    
    async function joinCall() {
        const guestName = guestNameInput.value.trim();
        if (!guestName) {
            alert('Please enter your name');
            return;
        }
        
        if (!window.hostId) {
            alert('Invalid link');
            return;
        }
        
        if (!localStream) {
            await startCamera();
        }
        if (!peer) {
            await initPeer();
        }
        
        myName = guestName;
        myNameSpan.textContent = myName;
        remoteNameSpan.textContent = 'Host';
        
        updateStatus('📞 Connecting to host...', 'calling');
        
        // Create call with data channel setup
        const call = peer.call(window.hostId, localStream, { metadata: { name: guestName } });
        setupDataChannel(call);
        
        call.on('stream', (stream) => {
            remoteVideo.srcObject = stream;
            remoteDot.style.background = '#48bb78';
            remoteDot.classList.remove('dot-off');
            isInCall = true;
            updateStatus('🎥 Connected!', 'online');
            addSystemMessage('🎥 Connected to the call!');
        });
        
        call.on('close', () => {
            remoteVideo.srcObject = null;
            remoteDot.style.background = '#ffc107';
            remoteDot.classList.add('dot-off');
            remoteNameSpan.textContent = 'Disconnected';
            isInCall = false;
            updateChatUI(false);
            dataChannel = null;
            updateStatus('Call ended', 'online');
            addSystemMessage('📞 Call ended');
        });
        
        call.on('error', (err) => {
            console.error('Call error:', err);
            updateStatus('Failed to connect', 'offline');
            alert('Could not connect. Make sure host is online and has created a link.');
        });
        
        currentCall = call;
        guestSection.classList.add('hidden');
    }
    
    function hangUp() {
        if (currentCall) {
            currentCall.close();
            currentCall = null;
        }
        if (dataChannel) {
            dataChannel.close();
            dataChannel = null;
        }
        remoteVideo.srcObject = null;
        remoteDot.style.background = '#ffc107';
        remoteDot.classList.add('dot-off');
        remoteNameSpan.textContent = 'Waiting...';
        isInCall = false;
        updateChatUI(false);
        updateStatus('Call ended', 'online');
        addSystemMessage('📞 You ended the call');
    }
    
    // ========== Event Listeners ==========
    startCamBtn.addEventListener('click', startCamera);
    muteMicBtn.addEventListener('click', toggleMuteMic);
    muteCamBtn.addEventListener('click', toggleMuteCam);
    hangupBtn.addEventListener('click', hangUp);
    createBtn.addEventListener('click', createCall);
    copyBtn.addEventListener('click', copyLink);
    joinBtn.addEventListener('click', joinCall);
    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
    
    // ========== Initialize ==========
    initPeer().catch(console.error);
    autoJoin();
    
    console.log('%c🎥 App Ready!', 'color: #25d366; font-size: 16px');
    console.log('%c💬 Chat will show "🟢 Chat Ready" when connected', 'color: #075e54; font-size: 12px');
    console.log('%c📩 Type messages and press Enter to send', 'color: #075e54; font-size: 12px');
</script>
</body>
</html>
